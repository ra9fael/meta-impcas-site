# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            "

BBFILE_COLLECTIONS += "impcas-site"
BBFILE_PATTERN_impcas-site = "^${LAYERDIR}/"
BBFILE_PRIORITY_impcas-site = "5"

# Site-configuration services shared across IMPCAS projects (the impcas-*
# family uses the maintainer prefix, the suffix names the theme): machine
# similar plumbing that does not depend on a machine or on EPICS.
# Board-specific recipes (device tree, kernel, u-boot) belong to the project's
# meta-user, EPICS recipes to meta-epics.

LAYERSERIES_COMPAT_impcas-site = "scarthgap"

LAYERDEPENDS_impcas-site = "core"
